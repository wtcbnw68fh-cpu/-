<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>🐙 문어 간지럽히기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: "Jua", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    min-height: 100dvh; overflow-x: hidden; color: #0b4a63;
    background: #2bb5c9;
    display: flex; flex-direction: column; align-items: center;
    user-select: none; -webkit-user-select: none;
  }

  /* ===== 얕은 바다 배경 ===== */
  .sea { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
         background: linear-gradient(180deg, #b6f3ee 0%, #6fdde2 14%, #3cc3d3 38%, #24a8c4 66%, #2a9fb8 82%, #5fb4b4 100%); }
  .rays { position: absolute; inset: 0; mix-blend-mode: screen; }
  .ray { position: absolute; top: -15%; height: 115%; transform-origin: top center;
         background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,.12) 55%, rgba(255,255,255,0) 85%);
         filter: blur(10px); animation: ray 9s ease-in-out infinite alternate; }
  @keyframes ray { 0% { opacity: .25; translate: -14px 0; } 100% { opacity: .7; translate: 14px 0; } }
  .sand { position: absolute; left: 0; bottom: 0; width: 100%; height: 19vh; }
  .coral { position: absolute; bottom: 7vh; width: min(40vw, 230px); height: auto; opacity: .92; filter: saturate(.85); }
  .coral.l { left: -4vw; } .coral.r { right: -4vw; }
  .coral .sway { transform-box: fill-box; transform-origin: bottom center; animation: kelp 5s ease-in-out infinite alternate; }
  .coral .sway.b { animation-duration: 6.5s; animation-delay: -2s; }
  @keyframes kelp { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  .tank { position: absolute; inset: 0; }
  .fish { position: absolute; left: 0; opacity: .82; will-change: transform; }
  .fish svg { display: block; width: 100%; height: auto; animation: bob 3.2s ease-in-out infinite alternate; }
  .fish.toL svg { transform: scaleX(-1); animation-name: bobL; }
  .fish .tail { transform-box: fill-box; transform-origin: right center; animation: wag .45s ease-in-out infinite alternate; }
  @keyframes swimR { from { transform: translateX(-20vw); } to { transform: translateX(120vw); } }
  @keyframes swimL { from { transform: translateX(120vw); } to { transform: translateX(-20vw); } }
  @keyframes bob { from { transform: translateY(-5px); } to { transform: translateY(5px); } }
  @keyframes bobL { from { transform: scaleX(-1) translateY(-5px); } to { transform: scaleX(-1) translateY(5px); } }
  @keyframes wag { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
  #caustics { position: absolute; inset: 0; width: 100%; height: 100%; opacity: .65; }
  .surface { position: absolute; top: 0; left: 0; width: 100%; height: 110px;
             background: linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0)); }
  .surface svg { position: absolute; top: 6px; left: 0; width: 200%; height: 26px; animation: drift 14s linear infinite; }
  .surface svg.b { top: 20px; animation-duration: 20s; animation-direction: reverse; opacity: .6; }
  @keyframes drift { from { transform: translateX(0); } to { transform: translateX(-50%); } }

  .ocean { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 0; }
  .bubble {
    position: absolute; bottom: -30px; border-radius: 50%; opacity: .7;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.95), rgba(255,255,255,.25) 60%, rgba(255,255,255,.1));
    border: 1px solid rgba(255,255,255,.6);
    animation: rise linear forwards;
  }
  @keyframes rise {
    0% { transform: translate(0, 0); opacity: 0; }
    10% { opacity: .7; }
    50% { transform: translate(14px, -50vh); }
    100% { transform: translate(-10px, -110vh); opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) { .ray, .surface svg, .coral .sway, .fish svg, .fish .tail { animation: none; } }

  main { position: relative; z-index: 1; width: 100%; max-width: 480px; padding: 24px 18px 28px; display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 32px; font-weight: 400; color: #fff; text-shadow: 0 3px 0 #e2577f, 0 6px 14px rgba(29,53,87,.25); letter-spacing: 1px; }
  .sub { margin-top: 6px; font-size: 16px; color: #0b4a63; opacity: .9; }

  .stage { position: relative; width: 100%; max-width: 340px; margin-top: 14px; touch-action: none; cursor: grab; }
  .stage:active { cursor: grabbing; }
  .stage svg { width: 100%; height: auto; display: block; overflow: visible; }

  .ink { position: fixed; inset: 0; pointer-events: none; z-index: 5; opacity: 0; background: rgba(0,0,0,.55); }
  .ink span { position: absolute; border-radius: 50%; transform: translate(-50%,-50%);
              background: radial-gradient(circle, #000 0%, #050505 58%, rgba(0,0,0,0) 72%); }
  .ink.show { animation: inky 2.4s ease-out forwards; }
  @keyframes inky {
    0% { opacity: 0; transform: scale(.3); }
    12% { opacity: 1; transform: scale(1.05); }
    65% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.08); }
  }
  .ink-msg {
    position: fixed; left: 50%; top: 45%; transform: translate(-50%, -50%); z-index: 6;
    color: #fff; font-size: 24px; text-align: center; white-space: nowrap; pointer-events: none;
    text-shadow: 0 2px 10px rgba(0,0,0,.8); opacity: 0;
  }
  .ink-msg.show { animation: msg 2.4s ease-out forwards; }
  @keyframes msg {
    0%, 10% { opacity: 0; transform: translate(-50%, -40%); }
    25% { opacity: 1; transform: translate(-50%, -50%); }
    75% { opacity: 1; transform: translate(-50%, -50%); }
    100% { opacity: 0; transform: translate(-50%, -60%); }
  }

  .meter-wrap { width: 100%; max-width: 340px; margin-top: 8px; }
  .meter-label { display: flex; justify-content: space-between; font-size: 15px; color: #0b4a63; margin-bottom: 6px; }
  .meter { height: 18px; border-radius: 999px; background: rgba(255,255,255,.6); overflow: hidden; border: 3px solid #fff; }
  .meter i { display: block; height: 100%; width: 0%; border-radius: 999px;
             background: linear-gradient(90deg, #ffd166, #f08aa8, #e2577f); transition: width .08s linear; }

  .stats { display: flex; gap: 10px; margin-top: 16px; width: 100%; max-width: 340px; }
  .stat { flex: 1; background: rgba(255,255,255,.85); border-radius: 18px; padding: 10px 8px; text-align: center; box-shadow: 0 4px 0 rgba(29,53,87,.1); }
  .stat b { display: block; font-size: 26px; font-weight: 400; color: #e2577f; }
  .stat small { font-size: 13px; color: #457b9d; }

  .row { display: flex; gap: 10px; margin-top: 14px; }
  button {
    font-family: inherit; font-size: 16px; border: 0; border-radius: 999px; padding: 10px 18px; cursor: pointer;
    background: #fff; color: #1d4e89; box-shadow: 0 4px 0 rgba(29,53,87,.15);
  }
  button:active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(29,53,87,.15); }
  footer { margin-top: 22px; font-size: 13px; color: #0b4a63; opacity: .7; }
</style>
</head>
<body>
  <div class="sea" aria-hidden="true">
    <div class="rays">
      <div class="ray" style="left:6%;width:16vw;rotate:16deg"></div>
      <div class="ray" style="left:30%;width:10vw;rotate:14deg;animation-delay:-3s"></div>
      <div class="ray" style="left:52%;width:20vw;rotate:12deg;animation-delay:-6s"></div>
      <div class="ray" style="left:80%;width:12vw;rotate:10deg;animation-delay:-1.5s"></div>

    <svg class="sand" viewBox="0 0 400 100" preserveAspectRatio="none">

        <stop offset="0%" stop-color="#bfe0cf"/><stop offset="22%" stop-color="#ecdcae"/><stop offset="100%" stop-color="#dcc28c"/>
      </linearGradient></defs>
      <path d="M0 26 Q50 12 100 22 T200 20 T300 26 T400 18 V100 H0 Z" fill="url(#sandG)"/>

      <g class="sway b" stroke="#5cc28f" stroke-width="5" stroke-linecap="round" fill="none">
        <path d="M38 170 C48 145 30 130 40 106"/>
      </g>
      <path d="M8 170 C10 132 58 120 90 136 C122 120 162 140 168 170 Z" fill="#5d8a98"/>
      <g stroke="#ff8f7e" stroke-width="10" stroke-linecap="round" fill="none">
        <path d="M74 142 C70 112 62 96 50 80"/><path d="M68 114 C80 98 86 86 84 66"/>
        <path d="M58 98 C48 90 42 78 44 60"/><path d="M80 90 C92 82 98 72 100 58"/>

      </g>
      <ellipse cx="140" cy="152" rx="30" ry="21" fill="#e7b45d"/>
      <g stroke="#c48d3c" stroke-width="2.5" fill="none" stroke-linecap="round">
        <path d="M117 152 q6 -8 12 0 t12 0 t12 0 t12 0"/><path d="M123 142 q6 -8 12 0 t12 0 t12 0"/>
      </g>
    </svg>

    <svg class="coral r" viewBox="0 0 200 170">
      <g class="sway" stroke="#2f9e8f" stroke-width="7" stroke-linecap="round" fill="none">
        <path d="M182 170 C192 140 170 122 182 94 C190 74 174 60 182 40"/>
      </g>
      <path d="M30 170 C36 140 80 128 110 140 C140 126 186 138 194 170 Z" fill="#577d8e"/>
      <path d="M118 146 C78 128 70 80 86 52 C104 32 142 32 162 56 C178 82 170 128 132 146 Z" fill="rgba(186,130,206,.38)" stroke="#b07cc6" stroke-width="3"/>
      <g stroke="#a066bb" stroke-width="2.5" stroke-linecap="round">
        <path d="M125 146 L90 62"/><path d="M125 146 L104 44"/><path d="M125 146 L124 38"/><path d="M125 146 L146 44"/><path d="M125 146 L163 64"/><path d="M125 146 L168 96"/><path d="M125 146 L82 96"/>
      </g>
      <g fill="#ff9f5a">
        <rect x="38" y="104" width="16" height="56" rx="8"/><rect x="56" y="86" width="18" height="74" rx="9"/><rect x="22" y="122" width="14" height="40" rx="7"/>
      </g>
      <g fill="#b85a2a"><ellipse cx="46" cy="109" rx="5" ry="3"/><ellipse cx="65" cy="91" rx="6" ry="3.5"/><ellipse cx="29" cy="127" rx="4.5" ry="2.6"/></g>
    </svg>

    <div class="tank" id="tank"></div>
    <canvas id="caustics"></canvas>

    <div class="surface">
      <svg viewBox="0 0 800 40" preserveAspectRatio="none"><path d="M0 20 Q50 8 100 20 T200 20 T300 20 T400 20 T500 20 T600 20 T700 20 T800 20" stroke="rgba(255,255,255,.55)" stroke-width="3" fill="none"/></svg>
      <svg class="b" viewBox="0 0 800 40" preserveAspectRatio="none"><path d="M0 20 Q50 30 100 20 T200 20 T300 20 T400 20 T500 20 T600 20 T700 20 T800 20" stroke="rgba(255,255,255,.45)" stroke-width="2" fill="none"/></svg>
    </div>
  </div>
  <div class="ocean" id="ocean"></div>
  <div class="ink" id="ink"></div>
  <div class="ink-msg" id="inkMsg">너무 많이 간지럽혔나보다...</div>

  <main>
    <h1>🐙 문어 간지럽히기</h1>
    <p class="sub">문어를 문지르거나 톡톡 눌러보세요!</p>

    <div class="stage" id="stage">

        <defs>

            <stop offset="0%" stop-color="#f07b9c"/>
            <stop offset="70%" stop-color="#e2577f"/>
            <stop offset="100%" stop-color="#d44a73"/>
          </radialGradient>
          <radialGradient id="cheek">
            <stop offset="0%" stop-color="#ff2f63" stop-opacity=".9"/>
            <stop offset="100%" stop-color="#ff2f63" stop-opacity="0"/>

        </defs>
        <ellipse cx="150" cy="282" rx="85" ry="9" fill="rgba(29,53,87,.15)"/>
        <g id="octo">
          <!-- 외곽선 레이어 -->
          <g id="legsLine"></g>
          <ellipse cx="150" cy="125" rx="102" ry="95" fill="#e2577f" stroke="#2a1d1d" stroke-width="5"/>
          <!-- 채우기 레이어 (머리와 다리 이음새 감추기) -->
          <g id="legsFill"></g>
          <ellipse cx="108" cy="68" rx="42" ry="22" fill="#fff" opacity=".16" transform="rotate(-28 108 68)"/>

          <!-- 볼터치 -->
          <g id="blush" opacity=".75">
            <ellipse cx="92" cy="152" rx="26" ry="20" fill="url(#cheek)"/>
            <ellipse cx="214" cy="120" rx="26" ry="20" fill="url(#cheek)"/>

          <!-- 눈 (기본) -->
          <g id="eyesOpen">
            <g id="eyeL"><ellipse cx="107" cy="135" rx="10.5" ry="11.5" fill="#1a1414"/><circle cx="104" cy="131" r="3.6" fill="#fff"/></g>
            <g id="eyeR"><ellipse cx="181" cy="112" rx="10.5" ry="11.5" fill="#1a1414"/><circle cx="178" cy="108" r="3.6" fill="#fff"/></g>
          </g>
          <!-- 눈 (웃을 때 ^^) -->
          <g id="eyesHappy" style="display:none" stroke="#1a1414" stroke-width="5" stroke-linecap="round" fill="none">
            <path d="M96 139 Q107 124 118 139"/>
            <path d="M170 116 Q181 101 192 116"/>
          </g>
          <!-- 웃음 눈물 -->
          <g id="tears" style="display:none" fill="#8fd8ff" stroke="#2a1d1d" stroke-width="2">
            <path d="M88 138 q-9 13 0 17 q9 -4 0 -17z"/>
            <path d="M201 114 q-9 13 0 17 q9 -4 0 -17z"/>
          </g>

          <!-- 입 (동그란 주둥이) -->
          <g id="snout">
            <ellipse cx="147" cy="133" rx="16" ry="14" fill="#f4a3b8" stroke="#2a1d1d" stroke-width="4"/>
            <ellipse id="hole" cx="147" cy="133" rx="4" ry="4.5" fill="#2a1d1d"/>
          </g>

          <!-- 흔들림 표시 -->
          <g id="laughMarks" style="display:none" stroke="#2a1d1d" stroke-width="3.5" stroke-linecap="round" fill="none">
            <path d="M34 92 q-8 12 -4 26"/>
            <path d="M22 100 q-8 12 -4 26"/>
            <path d="M266 92 q8 12 4 26"/>
            <path d="M278 100 q8 12 4 26"/>

        </g>
      </svg>
    </div>

    <div class="meter-wrap">
      <div class="meter-label"><span>간지럼 게이지</span><span id="pct">0%</span></div>
      <div class="meter"><i id="bar"></i></div>
    </div>

    <div class="stats">
      <div class="stat"><b id="cnt">0</b><small>간지럼 횟수</small></div>
      <div class="stat"><b id="ink-cnt">0</b><small>먹물 발사</small></div>
      <div class="stat"><b id="best">0%</b><small>최고 웃음</small></div>
    </div>

    <div class="row">
      <button id="sound">🔊 소리 켜짐</button>
      <button id="reset">🔄 처음부터</button>
    </div>

    <footer>AI 코딩 스터디 2주차 배포 과제 · Made with Claude</footer>
  </main>

<script>
(() => {
  const NS = "http://www.w3.org/2000/svg";
  const $ = (id) => document.getElementById(id);
  const stage = $("stage"), octo = $("octo");
  const bar = $("bar"), pct = $("pct");

  // ---------- 다리 (짧고 통통한 다리 5개) ----------
  const LEG = "M-17 -10 C-19 22 -12 46 0 56 C8 63 20 60 18 49 C16 41 12 28 15 -10 Z";
  function el(tag, attrs) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  const legs = [94, 118, 140, 160, 182, 206].map((x, i) => {
    const dir = x < 150 ? -1 : 1;
    const line = el("g", {}), fill = el("g", {});
    const pl = el("g", { transform: `scale(${dir} 1)` });
    const pf = el("g", { transform: `scale(${dir} 1)` });
    pl.appendChild(el("path", { d: LEG, fill: "#e2577f", stroke: "#2a1d1d", "stroke-width": 9, "stroke-linejoin": "round" }));
    pf.appendChild(el("path", { d: LEG, fill: "#e2577f" }));
    line.appendChild(pl); fill.appendChild(pf);
    $("legsLine").appendChild(line); $("legsFill").appendChild(fill);
    return { line, fill, x, base: -(x - 150) * 0.95, ph: i * 1.3 };
  });

  // ---------- 상태 ----------
  let level = 0, best = 0, count = 0, inks = 0;
  let pressed = false, last = null, lastHit = 0, lastTickle = 0, cooldown = 0;
  let muted = false, ctx = null;
  let blinkAt = performance.now() + 2500, blinking = 0;
  let lookT = { x: 0, y: 0 }, look = { x: 0, y: 0 };

  // ---------- 소리 ----------
  function audio() {
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { ctx = null; } }
    if (ctx && ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function blip(f, t0, dur, vol = 0.12) {
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "triangle";
    o.frequency.setValueAtTime(f, t0);
    o.frequency.exponentialRampToValueAtTime(f * 1.45, t0 + dur * 0.45);
    o.frequency.exponentialRampToValueAtTime(f * 0.95, t0 + dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(ctx.destination);
    o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function giggle() {
    if (muted || !audio()) return;
    const t = ctx.currentTime, f = 620 + Math.random() * 380 + level * 3;
    blip(f, t, 0.09); blip(f * 1.12, t + 0.1, 0.09);
  }
  function blorp() {
    if (muted || !audio()) return;
    const t = ctx.currentTime, o = ctx.createOscillator(), g = ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(320, t); o.frequency.exponentialRampToValueAtTime(60, t + 0.6);
    g.gain.setValueAtTime(0.28, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.65);
    o.connect(g).connect(ctx.destination); o.start(t); o.stop(t + 0.7);
  }

  // ---------- 먹물 ----------
  function inkBurst() {
    inks++; $("ink-cnt").textContent = inks;
    best = 100; $("best").textContent = "100%";
    const ink = $("ink"), msg = $("inkMsg");
    ink.innerHTML = "";
    for (let i = 0; i < 14; i++) {
      const s = document.createElement("span");
      const size = 180 + Math.random() * 320;
      s.style.width = s.style.height = size + "px";
      s.style.left = (Math.random() * 100) + "%"; s.style.top = (Math.random() * 100) + "%";
      ink.appendChild(s);
    }
    ink.classList.remove("show"); msg.classList.remove("show");
    void ink.offsetWidth;
    ink.classList.add("show"); msg.classList.add("show");
    blorp();
    if (navigator.vibrate) try { navigator.vibrate([30, 40, 60]); } catch (e) {}
    level = 30; cooldown = performance.now() + 2200;
  }

  function tickle(amount) {
    const now = performance.now();
    if (now < cooldown) return;
    level = Math.min(100, level + amount);
    lastTickle = now;
    if (now - lastHit > 130) {
      lastHit = now; count++; $("cnt").textContent = count;
      giggle();
      if (navigator.vibrate) try { navigator.vibrate(8); } catch (e) {}
    }
    if (level >= 100) inkBurst();
  }

  function local(e) {
    const r = stage.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top };
  }

  stage.addEventListener("pointerdown", (e) => {
    pressed = true; audio();
    last = local(e);
    try { stage.setPointerCapture(e.pointerId); } catch (_) {}
    tickle(6);
  });
  stage.addEventListener("pointermove", (e) => {
    const p = local(e);
    if (pressed || e.pointerType === "mouse") {
      if (last) {
        const d = Math.hypot(p.x - last.x, p.y - last.y);
        if (d > 2) tickle(Math.min(d * 0.055, 4));
      }
      last = p;
    }
  });
  const up = () => { pressed = false; last = null; };
  stage.addEventListener("pointerup", up);
  stage.addEventListener("pointercancel", up);
  stage.addEventListener("pointerleave", (e) => { if (e.pointerType === "mouse") last = null; });

  // 눈이 손가락/마우스 쪽을 살짝 바라봄
  window.addEventListener("pointermove", (e) => {
    const r = stage.getBoundingClientRect();
    const cx = r.left + r.width / 2, cy = r.top + r.height * 0.42;
    const dx = e.clientX - cx, dy = e.clientY - cy, d = Math.hypot(dx, dy) || 1;
    const m = Math.min(4, d / 40);
    lookT = { x: dx / d * m, y: dy / d * m };
  });

  $("sound").addEventListener("click", () => {
    muted = !muted;
    $("sound").textContent = muted ? "🔇 소리 꺼짐" : "🔊 소리 켜짐";
  });
  $("reset").addEventListener("click", () => {
    level = best = count = inks = 0;
    $("cnt").textContent = "0"; $("ink-cnt").textContent = "0"; $("best").textContent = "0%";
  });

  // ---------- 애니메이션 루프 ----------
  const eyesOpen = $("eyesOpen"), eyesHappy = $("eyesHappy"), tears = $("tears");
  const blush = $("blush"), snout = $("snout"), hole = $("hole");
  const eyeL = $("eyeL"), eyeR = $("eyeR");
  const laughMarks = $("laughMarks");
  let prev = performance.now();

  function frame(now) {
    const dt = Math.min(0.05, (now - prev) / 1000); prev = now;
    const t = now / 1000;
    const recent = now - lastTickle < 350;
    level = Math.max(0, level - dt * (recent ? 6 : 16));
    if (level > best) { best = level; $("best").textContent = Math.round(best) + "%"; }

    const laughing = level > 8;
    const L = level / 100;

    // 다리 꼼지락
    const amp = 5 + level * 0.22, speed = 1.8 + level * 0.12;
    legs.forEach((g) => {
      const a = g.base + Math.sin(t * speed + g.ph) * amp;
      const tr = `translate(${g.x} 205) rotate(${a.toFixed(2)})`;
      g.line.setAttribute("transform", tr);
      g.fill.setAttribute("transform", tr);
    });

    // 몸 흔들림 + 말랑 찌그러짐
    const bob = Math.sin(t * 1.6) * 4;
    const shake = laughing ? Math.sin(t * 38) * (1 + L * 6) : 0;
    const squash = laughing ? Math.sin(t * 14) * (0.02 + L * 0.05) : Math.sin(t * 1.6) * 0.012;
    const tilt = laughing ? Math.sin(t * 9) * L * 6 : Math.sin(t * 0.8) * 3;
    octo.setAttribute("transform",
      `translate(${shake.toFixed(2)} ${bob.toFixed(2)}) rotate(${tilt.toFixed(2)} 150 200) translate(150 210) scale(${(1 + squash).toFixed(3)} ${(1 - squash).toFixed(3)}) translate(-150 -210)`);

    // 얼굴
    eyesOpen.style.display = laughing ? "none" : "";
    eyesHappy.style.display = laughing ? "" : "none";
    tears.style.display = level > 60 ? "" : "none";
    laughMarks.style.display = laughing ? "" : "none";
    blush.setAttribute("opacity", (0.7 + L * 0.3).toFixed(2));

    // 주둥이: 웃으면 오물오물 커짐
    const sn = laughing ? 1.08 + Math.abs(Math.sin(t * 12)) * (0.1 + L * 0.2) : 1;
    snout.setAttribute("transform", `translate(147 133) scale(${sn.toFixed(3)}) translate(-147 -133)`);
    hole.setAttribute("ry", laughing ? (5 + L * 4).toFixed(1) : 4.5);
    hole.setAttribute("rx", laughing ? (5 + L * 2).toFixed(1) : 4);

    // 시선 & 깜빡임
    look.x += (lookT.x - look.x) * 0.15; look.y += (lookT.y - look.y) * 0.15;
    if (now > blinkAt) { blinking = now; blinkAt = now + 2200 + Math.random() * 3000; }
    const b = now - blinking < 140 ? 0.12 : 1;
    eyeL.setAttribute("transform", `translate(${look.x.toFixed(2)} ${look.y.toFixed(2)}) translate(0 135) scale(1 ${b}) translate(0 -135)`);
    eyeR.setAttribute("transform", `translate(${look.x.toFixed(2)} ${look.y.toFixed(2)}) translate(0 112) scale(1 ${b}) translate(0 -112)`);

    // 게이지
    bar.style.width = level.toFixed(1) + "%";
    pct.textContent = Math.round(level) + "%";

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- 배경 물방울 ----------
  const ocean = $("ocean");
  function bubble() {
    if (ocean.childElementCount > 25) return;
    const d = document.createElement("div");
    const s = 6 + Math.random() * 18;
    d.className = "bubble";
    d.style.width = d.style.height = s + "px";
    d.style.left = Math.random() * 100 + "%";
    d.style.animationDuration = (7 + Math.random() * 7) + "s";
    d.addEventListener("animationend", () => d.remove());
    ocean.appendChild(d);
  }
  for (let i = 0; i < 6; i++) setTimeout(bubble, i * 400);
  setInterval(bubble, 1500);
})();
</script>
<script>
// ===== 바다 배경: 일렁이는 빛(커스틱) + 열대어 =====
(() => {
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  // --- 물빛 일렁임 (저해상도로 계산해서 화면 전체로 부드럽게 확대) ---
  const cv = document.getElementById("caustics");
  const g = cv.getContext("2d");
  let W = 0, H = 0, img = null;
  function size() {
    W = 90;
    H = Math.max(120, Math.min(260, Math.round(W * innerHeight / innerWidth)));
    cv.width = W; cv.height = H;
    img = g.createImageData(W, H);
  }
  size(); addEventListener("resize", size);
  const TAU = Math.PI * 2, inten = 0.005, S = 2.1;
  function draw(time) {
    const d = img.data;
    for (let y = 0; y < H; y++) {
      const depth = 0.45 + 0.55 * (y / H);
      for (let x = 0; x < W; x++) {
        const px = ((x / W * S) * TAU) % TAU - 250;
        const py = ((y / W * S) * TAU) % TAU - 250;
        let ix = px, iy = py, c = 1;
        for (let n = 0; n < 4; n++) {
          const t = time * (1 - 3.5 / (n + 1));
          const nx = px + Math.cos(t - ix) + Math.sin(t + iy);
          const ny = py + Math.sin(t - iy) + Math.cos(t + ix);
          ix = nx; iy = ny;
          c += 1 / Math.hypot(px / (Math.sin(ix + t) / inten), py / (Math.cos(iy + t) / inten));
        }
        c = 1.17 - Math.pow(c / 4, 1.4);
        const v = Math.min(1, Math.pow(Math.abs(c), 8));
        const i = (y * W + x) * 4;
        d[i] = 255; d[i + 1] = 255; d[i + 2] = 250; d[i + 3] = v * 255 * depth;
      }
    }
    g.putImageData(img, 0, 0);
  }
  let lastDraw = 0;
  function loop(now) {
    if (!document.hidden && now - lastDraw > 50) { lastDraw = now; draw(now / 1000 * 0.35 + 23); }
    requestAnimationFrame(loop);
  }
  if (reduce) draw(23); else requestAnimationFrame(loop);

  // --- 열대어 ---
  const tank = document.getElementById("tank");
  const BODY = "M8 18 C14 4 38 2 50 14 C54 17 54 20 50 23 C38 34 14 32 8 18 Z";
  const kinds = [
    // 노랑 탱
    `<path class="tail" d="M12 18 L0 7 Q3 18 0 29 Z" fill="#f4bf1f"/><path d="${BODY}" fill="#ffd23f"/><path d="M18 9 Q30 0 42 8" fill="#ffe27a"/><circle cx="44" cy="15" r="2.3" fill="#1a1a1a"/>`,
    // 파랑 탱
    `<path class="tail" d="M12 18 L0 7 Q3 18 0 29 Z" fill="#ffd23f"/><path d="${BODY}" fill="#2f6fd6"/><path d="M16 14 Q30 6 44 16 Q30 12 18 20 Z" fill="#163d86"/><circle cx="44" cy="15" r="2.3" fill="#111"/>`,
    // 주황 줄무늬
    `<path class="tail" d="M12 18 L0 7 Q3 18 0 29 Z" fill="#ff8c42"/><path d="${BODY}" fill="#ff8c42"/><path d="M23 7 Q27 18 23 29" stroke="#fff" stroke-width="5" fill="none"/><path d="M38 6 Q41 18 38 30" stroke="#fff" stroke-width="4" fill="none"/><circle cx="45" cy="15" r="2.2" fill="#1a1a1a"/>`,
    // 민트 작은 물고기
    `<path class="tail" d="M12 18 L0 9 Q3 18 0 27 Z" fill="#4fcfbf"/><path d="M8 18 C16 8 38 8 50 16 C52 18 52 19 50 21 C38 29 16 28 8 18 Z" fill="#7ce8d7"/><path d="M14 20 Q30 24 48 19" stroke="#c9fff6" stroke-width="2" fill="none"/><circle cx="45" cy="16" r="2" fill="#1a1a1a"/>`
  ];
  function spawn(opts = {}) {
    if (tank.childElementCount > 6) return;
    const k = opts.kind ?? ((Math.random() * kinds.length) | 0);
    const toL = opts.toL ?? Math.random() < 0.5;
    const f = document.createElement("div");
    f.className = "fish" + (toL ? " toL" : "");
    const w = opts.w ?? (k === 3 ? 20 + Math.random() * 8 : 28 + Math.random() * 16);
    f.style.width = w + "px";
    f.style.top = (opts.top ?? (22 + Math.random() * 50)) + "%";
    const dur = opts.dur ?? (22 + Math.random() * 16);
    f.style.animation = `${toL ? "swimL" : "swimR"} ${dur}s linear ${opts.delay ?? 0}s forwards`;
    f.innerHTML = `<svg viewBox="0 0 56 36" style="animation-delay:${-Math.random() * 3}s">${kinds[k]}</svg>`;
    f.addEventListener("animationend", (e) => { if (e.target === f) f.remove(); });
    tank.appendChild(f);
  }
  function school() {
    const toL = Math.random() < 0.5, top = 28 + Math.random() * 35, dur = 26 + Math.random() * 8;
    for (let i = 0; i < 4; i++) spawn({ kind: 3, toL, top: top + (Math.random() * 6 - 3), dur, delay: i * 0.5 + Math.random() * 0.3, w: 18 + Math.random() * 6 });
  }
  if (!reduce) {
    spawn({ delay: -12 }); spawn({ delay: -6, toL: true });
    setInterval(() => { if (!document.hidden) (Math.random() < 0.25 ? school : spawn)(); }, 7000);
  }
})();
</script>
