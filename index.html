<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 첫 배포 사이트</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #1e1b4b, #4c1d95 55%, #db2777);
    color: #fff; padding: 24px;
  }
  .card {
    max-width: 520px; width: 100%; background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2); border-radius: 20px;
    padding: 40px 32px; text-align: center; backdrop-filter: blur(10px);
  }
  .emoji { font-size: 56px; }
  h1 { font-size: 28px; margin: 16px 0 8px; }
  p { opacity: 0.85; line-height: 1.6; }
  .time { margin-top: 24px; font-size: 40px; font-weight: 700; letter-spacing: 1px; }
  .date { opacity: 0.7; margin-top: 4px; }
  button {
    margin-top: 28px; padding: 12px 28px; border: none; border-radius: 999px;
    background: #fff; color: #4c1d95; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  .msg { margin-top: 16px; min-height: 24px; font-weight: 600; }
  footer { margin-top: 28px; font-size: 13px; opacity: 0.6; }
</style>
</head>
<body>
  <div class="card">
    <div class="emoji">🚀</div>
    <h1>나의 첫 배포 사이트</h1>
    <p>AI 코딩 스터디 2주차 과제로 만들고 배포한 사이트입니다.<br>이 페이지가 보인다면 배포 성공! 🎉</p>
    <div class="time" id="time">--:--:--</div>
    <div class="date" id="date"></div>
    <button id="btn">오늘의 응원 받기</button>
    <div class="msg" id="msg"></div>
    <footer>Made with Claude</footer>
  </div>
<script>
  const msgs = [
    "오늘도 한 줄의 코드가 세상을 바꿔요 💡",
    "에러는 성장의 증거입니다 🌱",
    "배포까지 해낸 당신, 최고예요 🏆",
    "완벽보다 완성이 먼저! ✅",
    "작은 시도가 큰 결과를 만들어요 ✨"
  ];
  function tick() {
    const now = new Date();
    document.getElementById("time").textContent = now.toLocaleTimeString("ko-KR", { hour12: false });
    document.getElementById("date").textContent = now.toLocaleDateString("ko-KR", { year: "numeric", month: "long", day: "numeric", weekday: "long" });
  }
  tick(); setInterval(tick, 1000);
  document.getElementById("btn").addEventListener("click", () => {
    document.getElementById("msg").textContent = msgs[Math.floor(Math.random() * msgs.length)];
  });
</script>
</body>
</html>
